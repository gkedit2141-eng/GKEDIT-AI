<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GKEDIT AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GKEDIT AI</h1>
        <p>MOBILE EDITION</p>
    </header>

    <div class="core">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="center"></div>
    </div>

    <p class="core-text">CORE ACTIVE</p>

    <div class="status">
        <div class="status-item">ONLINE</div>
        <div class="status-item">LOCKED</div>
    </div>

    <h2>SYSTEM STATUS</h2>

    <div class="status-rows">
        <div class="row"><span>AI CORE</span><b class="on">• ON</b></div>
        <div class="row"><span>NETWORK</span><b class="on">• ON</b></div>
        <div class="row"><span>V0ICE</span><b class="off">o OFF</b></div>
        <div class="row"><span>MEMORY</span><b class="off">o LOCKED</b></div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <input id="msg" placeholder="Ask GKEDIT AI..."> 
        <button id="send">SEND</button>
    </div>

    <script src="script.js"></script> 
</body>
</html>
